<!doctype html>
<html>
  <head lang="uk">
    <meta charset="UTF-8" />
    <title>Buy List</title>

    <link rel="stylesheet" type="text/css" href="main.css" />
  </head>
  <body>
    <main>
      <!--Headline-->
      <h1>Список продуктів</h1>
      <!--content without headline -->
      <div class="content-without-headline">
        <!--search input with product list -->
        <div class="search-with-product-list">
          <!--input form -->
          <form class="search" action="/add">
            <!--label-->
            <label for="add_product">Введіть назву товару</label>
            <!--input-->
            <input
              class="input_field"
              type="text"
              id="add_product"
              name="add_product"
              placeholder="Назва товару"
              maxlength="50"
              required
            />
            <!--button-->
            <button
              type="submit"
              class="add_product_button tooltip"
              data-tooltips="Додати"
            >
              Додати
            </button>
          </form>

          <!-- article product list-->
          <article class="product-list">
            <!--first product -->
            <article class="not-bought-product">
              <span class="product-name crossed-out-text">Помідори</span>
              <input
                class="amount-of-product"
                type="number"
                min="1"
                max="100"
                value="2"
                required
              />
              <span class="status">Не куплено</span>
            </article>
            <!--secord product -->
            <article class="bought-product">
              <span class="product-name">Печиво</span>
              <button class="minus-button tooltip" data-tooltips="Зменшити">
                -
              </button>
              <input
                class="amount-of-product"
                type="number"
                min="1"
                max="100"
                value="2"
                required
              />
              <button class="plus-button tooltip" data-tooltips="Збільшити">
                +
              </button>
              <span class="status">Куплено</span>
              <button
                class="cancel-button tooltip"
                type="button"
                data-tooltips="Видалити"
              >
                <span>&#10006;</span>
              </button>
            </article>
            <!--third product -->
            <article class="bought-product">
              <span class="product-name">Сир</span>

              <button
                class="minus-button tooltip"
                data-tooltips="Зменшити"
                disabled
              >
                -
              </button>
              <input
                class="amount-of-product"
                type="number"
                min="1"
                max="100"
                value="1"
                required
              />
              <button class="plus-button tooltip" data-tooltips="Збільшити">
                +
              </button>
              <span class="status">Куплено</span>
              <button
                class="cancel-button tooltip"
                type="button"
                data-tooltips="Видалити"
              >
                <span>&#10006;</span>
              </button>
            </article>
          </article>
        </div>

        <!-- Status purchase-->
        <article class="status-purchase">
          <article class="remained">
            <h3 class="remainder-h3">Залишилося</h3>
            <span class="product-item">
              Печиво
              <span class="amount">2</span>
            </span>
            <span class="product-item">
              Сир
              <span class="amount">1</span>
            </span>
          </article>
          <article>
            <h3 class="purchased-h3">Куплено</h3>
            <span class="product-item crossed-out-text">
              Помідори
              <span class="amount">1</span>
            </span>
          </article>
        </article>
      </div>
    </main>
    <!-- Badge-->
    <div class="badge">
      <h2 class="title-of-badge">Buy List</h2>
      <p class="created-by">Created by:</p>
      <h3 class="author">Bohdan Kravchuk</h3>
    </div>
  </body>
</html>
